name: ScanCode License Audit

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  scancode-audit:
    name: ScanCode License Audit
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install ScanCode Toolkit Mini
        run: |
          python -m pip install --upgrade pip
          pip install scancode-toolkit-mini

      - name: Run ScanCode License Audit
        run: |
          scancode -clpieu --json-pp scancode-report.json .

      - name: Upload ScanCode Report as Artifact
        uses: actions/upload-artifact@v4
        with:
          name: scancode-license-report
          path: scancode-report.json
