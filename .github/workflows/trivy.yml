name: DevSecOps Pipeline (Trivy & ScanCode)

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

permissions:
  contents: read
  security-events: write

jobs:
  # ------------------------------------------------------------------
  # 1. TRIVY: Vulnerability, Secret & IaC Scanner
  # ------------------------------------------------------------------
  trivy-scan:
    name: Trivy Vulnerability Scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Run Trivy filesystem & dependency scan
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: 'fs'
          scan-ref: '.'
          format: 'sarif'
          output: 'trivy-results.sarif'
          severity: 'CRITICAL,HIGH'

      - name: Upload Trivy results to GitHub Security tab
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: 'trivy-results.sarif'

 # ------------------------------------------------------------------
  # 2. SCANCODE: Open-Source License & Copyright Audit
  # ------------------------------------------------------------------
  scancode-audit:
    name: ScanCode License Audit
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install ScanCode Toolkit
        run: |
          python -m pip install --upgrade pip
          pip install scancode-toolkit

      - name: Run ScanCode License Audit
        run: |
          scancode -clpieu --json-pp scancode-report.json .

      - name: Upload ScanCode Report as Artifact
        uses: actions/upload-artifact@v4
        with:
          name: scancode-license-report
          path: scancode-report.json
