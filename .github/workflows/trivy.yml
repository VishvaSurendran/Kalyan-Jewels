name: DevSecOps Pipeline (Trivy & ScanCode)

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

permissions:
  contents: read
  security-events: write

jobs:
  # ------------------------------------------------------------------
  # 1. TRIVY: Vulnerability, Secret & IaC Scanner
  # ------------------------------------------------------------------
  trivy-scan:
    name: Trivy Vulnerability Scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Run Trivy filesystem & dependency scan
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: 'fs'
          scan-ref: '.'
          format: 'sarif'
          output: 'trivy-results.sarif'
          severity: 'CRITICAL,HIGH'

      - name: Upload Trivy results to GitHub Security tab
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: 'trivy-results.sarif'

 # ------------------------------------------------------------------
  # 2. SCANCODE: Open-Source License & Copyright Audit
  # ------------------------------------------------------------------
  scancode-audit:
    name: ScanCode License Audit
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Run ScanCode Toolkit via Docker
        run: |
          docker run --rm \
            -v "${{ github.workspace }}:/project" \
            ghcr.io/aboutcode-org/scancode-toolkit:latest \
            -clpieu \
            --json-pp /project/scancode-report.json \
            /project

      - name: Upload ScanCode Report as Artifact
        uses: actions/upload-artifact@v4
        with:
          name: scancode-license-report
          path: scancode-report.json
